<svg width="450" height="196" viewBox="0 0 450 196" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="yofukashi_bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="100%" stop-color="#101a2c"/></linearGradient>
<linearGradient id="yofukashi_top" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#61DAFB" stop-opacity="0"/><stop offset="50%" stop-color="#61DAFB" stop-opacity="0.8"/><stop offset="100%" stop-color="#61DAFB" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="448" height="194" rx="16" fill="url(#yofukashi_bg)" stroke="#1f2d40"/>
