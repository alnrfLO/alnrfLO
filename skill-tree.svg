<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#61DAFB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="698" height="258" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <text x="30" y="42" fill="#c9d1d9" font-family="Fira Code, monospace" font-size="18" font-weight="700">📊 Skill Tree</text>

  <!-- TypeScript / NestJS -->
  <text x="30" y="88" fill="#8b949e" font-family="Fira Code, monospace" font-size="13">TypeScript / NestJS</text>
  <rect x="250" y="76" width="380" height="14" rx="7" fill="#161b22" stroke="#30363d"/>
  <rect x="250" y="76" height="14" rx="7" fill="url(#barGrad)" filter="url(#glow)">
    <animate attributeName="width" from="0" to="304" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </rect>
  <text x="640" y="87" fill="#61DAFB" font-family="Fira Code, monospace" font-size="12" font-weight="700">
    80%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1s" fill="freeze"/>
  </text>

  <!-- React / Frontend -->
  <text x="30" y="128" fill="#8b949e" font-family="Fira Code, monospace" font-size="13">React / Frontend</text>
  <rect x="250" y="116" width="380" height="14" rx="7" fill="#161b22" stroke="#30363d"/>
  <rect x="250" y="116" height="14" rx="7" fill="url(#barGrad)" filter="url(#glow)">
    <animate attributeName="width" from="0" to="266" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </rect>
  <text x="640" y="127" fill="#61DAFB" font-family="Fira Code, monospace" font-size="12" font-weight="700">
    70%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
  </text>

  <!-- Python -->
  <text x="30" y="168" fill="#8b949e" font-family="Fira Code, monospace" font-size="13">Python</text>
  <rect x="250" y="156" width="380" height="14" rx="7" fill="#161b22" stroke="#30363d"/>
  <rect x="250" y="156" height="14" rx="7" fill="url(#barGrad)" filter="url(#glow)">
    <animate attributeName="width" from="0" to="209" dur="1.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </rect>
  <text x="640" y="167" fill="#61DAFB" font-family="Fira Code, monospace" font-size="12" font-weight="700">
    55%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
  </text>

  <!-- Java -->
  <text x="30" y="208" fill="#8b949e" font-family="Fira Code, monospace" font-size="13">Java (Fabric modding)</text>
  <rect x="250" y="196" width="380" height="14" rx="7" fill="#161b22" stroke="#30363d"/>
  <rect x="250" y="196" height="14" rx="7" fill="url(#barGrad)" filter="url(#glow)">
    <animate attributeName="width" from="0" to="152" dur="1.2s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </rect>
  <text x="640" y="207" fill="#61DAFB" font-family="Fira Code, monospace" font-size="12" font-weight="700">
    40%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/>
  </text>

  <text x="250" y="230" fill="#484f58" font-family="Fira Code, monospace" font-size="11" font-style="italic">← en cours de leveling</text>
</svg>
