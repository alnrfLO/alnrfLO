name: Generate Snake Animation & Stats

on:
  schedule:
    - cron: "0 0 * * *" # tous les jours à minuit
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        continue-on-error: true # le snake doit sortir même si les stats échouent
        run: node scripts/github-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: alnrfLO
          OUT: dist/github-stats.svg

      - name: Generate the snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: alnrfLO
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake & stats to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
